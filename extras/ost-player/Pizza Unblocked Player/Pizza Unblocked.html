const audio=document.getElementById('audio'),list=document.getElementById('list');
let library='pizza',tracks=libraries.pizza,current=Math.max(0,tracks.findIndex(t=>t.title==="It's Pizza Time!")),shuffle=false,repeat=false;
const remembered={pizza:current,sugary:0};
const fmt=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function render(){list.replaceChildren();tracks.forEach((t,i)=>{const b=document.createElement('button');b.className='track';b.innerHTML='<span class="num"></span><span class="thumb"><img alt="" loading="lazy"></span><span><strong></strong><small></small></span><span class="duration"></span>';b.querySelector('.num').textContent=i+1;b.querySelector('strong').textContent=t.title;b.querySelector('small').textContent=t.artist+(t.demo?' · Demo':'');b.querySelector('img').src=t.art;b.querySelector('.duration').textContent=fmt(t.duration);b.addEventListener('click',()=>load(i,true));list.append(b)})}
function load(i,play=false){current=(i+tracks.length)%tracks.length;remembered[library]=current;const t=tracks[current];audio.src=t.src;document.getElementById('title').textContent=t.title;document.getElementById('docktitle').textContent=t.title;document.getElementById('artist').textContent=t.artist;document.getElementById('dock-artist').textContent=t.artist;document.querySelector('.album').textContent=t.game+(t.demo?' · Demo':library==='sugary'?' · Exhibition Night':'');document.getElementById('cover').src=t.art;document.getElementById('cover').alt=t.title+' artwork';document.getElementById('dock-cover').src=t.art;document.getElementById('art-note').textContent='';document.getElementById('status').textContent='';[...list.children].forEach((b,j)=>{b.classList.toggle('selected',j===current);b.setAttribute('aria-current',String(j===current))});update();playback();if(play)start()}
function start(){audio.play().then(()=>document.getElementById('status').textContent='').catch(()=>document.getElementById('status').textContent='Unable to play this song. Keep the audio folders beside the HTML.')}
function move(delta){load(shuffle?(current+1+Math.floor(Math.random()*(tracks.length-1)))%tracks.length:current+delta,true)}
function update(){document.querySelectorAll('.elapsed').forEach(e=>e.textContent=fmt(audio.currentTime));document.querySelectorAll('.total').forEach(e=>e.textContent=fmt(audio.duration||tracks[current].duration));for(const id of ['seek','dockseek']){const slider=document.getElementById(id);slider.value=audio.duration?audio.currentTime/audio.duration*1000:0;slider.style.setProperty('--progress',slider.value/10+'%')}}
function playback(){document.querySelectorAll('[data-action="play"]').forEach(b=>{b.textContent=audio.paused?'▶':'Ⅱ';b.setAttribute('aria-label',audio.paused?'Play':'Pause')})}
document.querySelectorAll('[data-library]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.library===library)return;const playing=!audio.paused;audio.pause();library=b.dataset.library;tracks=libraries[library];document.querySelectorAll('[data-library]').forEach(e=>{e.classList.toggle('chosen',e===b);e.setAttribute('aria-selected',String(e===b))});document.body.classList.toggle('sugary',library==='sugary');render();load(remembered[library],playing);list.scrollTop=0}));
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='play')audio.paused?start():audio.pause();if(a==='next')move(1);if(a==='prev'){audio.currentTime>3?audio.currentTime=0:move(-1)}if(a==='shuffle'||a==='repeat'){if(a==='shuffle')shuffle=!shuffle;else{repeat=!repeat;audio.loop=repeat}document.querySelectorAll('[data-action="'+a+'"]').forEach(e=>{const active=a==='shuffle'?shuffle:repeat;e.classList.toggle('active',active);e.setAttribute('aria-pressed',String(active))})}});
for(const id of ['seek','dockseek'])document.getElementById(id).addEventListener('input',e=>{if(Number.isFinite(audio.duration))audio.currentTime=e.target.value/1000*audio.duration});
audio.addEventListener('timeupdate',update);audio.addEventListener('loadedmetadata',update);audio.addEventListener('play',playback);audio.addEventListener('pause',playback);audio.addEventListener('ended',()=>{if(!repeat)move(1)});audio.addEventListener('error',()=>document.getElementById('status').textContent='Audio file missing. Keep both song folders beside the HTML.');
const volume=document.getElementById('volume'),mute=document.getElementById('mute');function syncVolume(){volume.value=audio.muted?0:audio.volume;volume.style.setProperty('--progress',volume.value*100+'%');mute.setAttribute('aria-label',audio.muted?'Unmute':'Mute')}volume.addEventListener('input',()=>{audio.volume=Number(volume.value);audio.muted=audio.volume===0;syncVolume()});mute.addEventListener('click',()=>{audio.muted=!audio.muted;syncVolume()});syncVolume();
document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();audio.paused?start():audio.pause()}if(e.code==='ArrowRight')move(1);if(e.code==='ArrowLeft')move(-1)});render();load(current);

</script></body></html>
